name: CI

on:
  push:
    branches:
    - master
    - wasm

  pull_request:
    branches:
    - master
    - wasm

env:
  WX_WIDGETS_VERSION: 3.2.9

jobs:
  wasm_build_and_test:
    if: github.ref == 'refs/heads/wasm' || github.base_ref == 'wasm' || github.head_ref == 'wasm'
    name: Build and Test WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TESTCAFE_BROWSER: chrome
      TESTCAFE_HEADLESS: '1'
      TESTCAFE_WATCHDOG_MS: 900000
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Set Up Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 4.0.5
    - name: Set Up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: latest
        cache: npm
    - name: Install Node Dependencies
      run: |
        node --version
        npm --version
        npm ci
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake autoconf-archive libtool
    - name: Run Full Web Test Suite
      run: npm test
    - name: Grade Node WebAssembly Tests
      run: npm run test:logo:node
    - name: Run Chrome Runner Tests
      run: npm run test:runner:browser
    - name: Run Lighthouse Audits
      run: npm run test:lighthouse
    - name: Archive Web Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: WebAssembly Test Reports
        path: |
          reports/testcafe.json
          reports/lighthouse/
          reports/turtle-graphics-examples/
          screenshots/failures/

  build_and_test:
    strategy:
      matrix:
        wx_version: [ libwxgtk3.2-dev ]
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Conditionally Add wxWidgets Unofficial Repo
      if: contains(matrix.wx_version, 'unofficial')
      run: |
        sudo apt-key adv --fetch-keys http://repos.codelite.org/CodeLite.asc
        sudo apt-add-repository 'deb https://repos.codelite.org/wx${{ env.WX_WIDGETS_VERSION }}/ubuntu/ jammy universe'
    - name: Update Package Info
      run: |
        sudo apt-get update
    - name: Install Dependencies
      run: >
        sudo apt-get install
        autoconf-archive
        libgtk-3-dev
        ${{ matrix.wx_version }}
        libnotify-dev
        python3-pil
        x11-apps
        x11-utils
        xauth
        xvfb
    - name: Build Logo
      run: |
        autoreconf --install
        ./configure --disable-wasm --enable-wx --enable-objects --enable-gitid --disable-docs
        grep -Eq '^#define HAVE_WX 1$' config.h
        make regenerate-help-index
        make
    - name: Run Tests
      timeout-minutes: 2
      env:
        LOGOLIB: ${{ github.workspace }}/logolib
      run: >
        xvfb-run
        -e /dev/stdout
        --auto-servernum
        $GITHUB_WORKSPACE/ucblogo $GITHUB_WORKSPACE/tests/UnitTests.lg
        -
        -f $GITHUB_WORKSPACE/logo-unit-test-results.txt
        -x
    - name: Grade Tests
      # Add an error annotation to the job for each test that failed or had an error.
      # Fail the step (and job) if any tests failed or had an error.
      run: |
        test -s logo-unit-test-results.txt
        awk '/\.\.\./ && ! /Ok$/{print "::error::"$0}' logo-unit-test-results.txt
        awk '/\.\.\./ {count++; if ($0 !~ /Ok$/) failed=1} END {if (count == 0 || failed) exit 1}' logo-unit-test-results.txt
    - name: Run wx Smoke Tests
      timeout-minutes: 3
      env:
        LOGOLIB: ${{ github.workspace }}/logolib
        TMPDIR: ${{ github.workspace }}/reports/wx-smoke
      run: |
        set -o pipefail
        mkdir -p "$TMPDIR"
        python3 -u tests/native/wx_smoke.py "$GITHUB_WORKSPACE/ucblogo" "$TMPDIR" 2>&1 | tee "$TMPDIR/results.txt"
    - name: Archive Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Logo Unit Test Results with ${{ matrix.wx_version }}
        path: |
          logo-unit-test-results.txt
          reports/wx-smoke/

  terminal_build_and_test:
    name: Build and Test Native Terminal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf-archive libncurses-dev
    - name: Build Logo
      run: |
        autoreconf --install
        ./configure --disable-wasm --disable-wx --disable-x11 --enable-objects --enable-gitid --disable-docs
        make regenerate-help-index
        make
    - name: Run Tests
      timeout-minutes: 2
      env:
        LOGOLIB: ${{ github.workspace }}/logolib
      run: |
        rm -f logo-unit-test-results-terminal.txt
        timeout 120s ./ucblogo "$GITHUB_WORKSPACE/tests/UnitTests.lg" - -f "$GITHUB_WORKSPACE/logo-unit-test-results-terminal.txt" -x
    - name: Grade Tests
      run: |
        test -s logo-unit-test-results-terminal.txt
        awk '/\.\.\./ && ! /Ok$/{print "::error::"$0; failed=1} /\.\.\./ {count++} END {if (count == 0 || failed) exit 1}' logo-unit-test-results-terminal.txt
    - name: Check Literal Terminal Output
      env:
        LOGOLIB: ${{ github.workspace }}/logolib
      run: |
        printf 'print "|<&>|\nbye\n' | ./ucblogo - > terminal-output.txt
        cat -A terminal-output.txt
        grep -Fx '<&>' terminal-output.txt
        ! grep -Eq '&lt;|&gt;|&amp;|&quot;|&apos;' terminal-output.txt
    - name: Archive Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Logo Unit Test Results - Native Terminal
        path: logo-unit-test-results-terminal.txt

    - name: Check Native Terminal PTY Behavior
      env:
        LOGOLIB: ${{ github.workspace }}/logolib
      run: |
        set -o pipefail
        python3 tests/native/pty_terminal.py "$GITHUB_WORKSPACE/ucblogo" | tee pty-terminal-results.txt
        awk '/\.\.\./ && ! /Ok$/{print "::error::"$0; failed=1} /\.\.\./ {count++} END {if (count == 0 || failed) exit 1}' pty-terminal-results.txt

    - name: Archive PTY Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Native Terminal PTY Results
        path: pty-terminal-results.txt

  terminal_default_build:
    name: Build Native Terminal Without Objects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf-archive libncurses-dev
    - name: Build Logo
      run: |
        autoreconf --install
        ./configure --disable-wasm --disable-wx --disable-x11 --disable-objects --disable-gitid --disable-docs
        grep -Eq '^#define WASM_MISSING 1$' config.h
        make regenerate-help-index
        make
    - name: Run and Grade Tests
      timeout-minutes: 2
      env:
        LOGOLIB: ${{ github.workspace }}/logolib
      run: |
        rm -f logo-unit-test-results-terminal-default.txt
        timeout 120s ./ucblogo "$GITHUB_WORKSPACE/tests/UnitTests.lg" - -f "$GITHUB_WORKSPACE/logo-unit-test-results-terminal-default.txt" -x
        test -s logo-unit-test-results-terminal-default.txt
        awk '/\.\.\./ && ! /Ok$/{print "::error::"$0; failed=1} /\.\.\./ {count++} END {if (count == 0 || failed) exit 1}' logo-unit-test-results-terminal-default.txt
    - name: Archive Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Logo Unit Test Results - Native Terminal Without Objects
        path: logo-unit-test-results-terminal-default.txt
