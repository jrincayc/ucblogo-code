name: Deploy Web

# Pushing a release tag (for example p52) builds, tests, and publishes the Web Edition to the
# gh_pages branch. A manual run does everything except publish and uploads the staged site.
on:
  push:
    tags:
    - 'p[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy_web:
    name: Build, Test, and Publish WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TESTCAFE_BROWSER: chrome
      TESTCAFE_HEADLESS: '1'
      TESTCAFE_WATCHDOG_MS: 900000
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Determine Version
      id: version
      run: |
        version=$(git describe --tags --always --dirty)
        if [ "$GITHUB_REF_TYPE" = tag ] && [ "$version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::git describe reports $version, expected the pushed tag $GITHUB_REF_NAME"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Set Up Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 4.0.5
    - name: Set Up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: latest
        cache: npm
    - name: Install Node Dependencies
      run: npm ci
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake autoconf-archive libtool
    - name: Build and Test
      run: npm test
    - name: Check Out Published Branch
      uses: actions/checkout@v4
      with:
        ref: gh_pages
        path: site
    - name: Stage Site
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: npm run stage:web -- site --expect-version "$VERSION"
    - name: Upload Staged Site
      if: github.ref_type != 'tag'
      uses: actions/upload-artifact@v4
      with:
        name: Staged Web Site
        path: |
          site
          !site/.git
    - name: Publish
      if: github.ref_type == 'tag'
      working-directory: site
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add -A
        if git diff --cached --quiet; then
          echo 'Nothing to publish'
          exit 0
        fi
        git commit -m "$VERSION"
        git push origin HEAD:gh_pages
